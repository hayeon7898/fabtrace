[project]
name = "fabtrace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hayeon7898", email = "hayeon22@korea.ac.kr" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
fabtrace = "fabtrace:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
